name: Mtailor
description: >-
  MTailor is a Y Combinator-backed custom-clothing company that measures your
  body with your phone's camera and manufactures made-to-order apparel on
  demand. Its mobile apps capture a short video or 360-degree turn and use
  machine-learning models to compute roughly 60 body measurements, which the
  company claims are about 20 percent more accurate than a professional tailor.
  MTailor produces custom shirts, polos, tees, pants, jeans, blazers and suits
  for men and jeans for women, each cut to the customer's unique measurement
  pattern. The business is a direct-to-consumer mobile app and e-commerce brand;
  as of this profile it publishes no public developer API, developer portal,
  OpenAPI definition, or first-party SDK. This APIs.json profile captures the
  company's identity and public web properties for the API Evangelist network.
